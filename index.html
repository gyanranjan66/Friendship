<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Friendship — Connect Beyond Distance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#07070d;--panel:#12121d;--gold:#f6c76b;--pink:#f044b8;--purple:#872cff;--muted:#a7a5b4;--line:#393044}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#211426 0,#090810 38%,var(--bg) 75%);color:#fff;font-family:'DM Sans',Arial,sans-serif;padding-bottom:100px}
.app{max-width:520px;margin:auto;padding:10px 16px 0}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px 18px}
.brand{width:min(61%,350px);height:74px;object-fit:contain;object-position:left center}
.balance{border:1.5px solid var(--gold);border-radius:40px;padding:10px 12px;display:flex;align-items:center;gap:9px;color:#fff;background:linear-gradient(135deg,#30200f,#111019);font-weight:800;white-space:nowrap;box-shadow:0 0 18px #e9ae3b22}
.balance .wallet{color:var(--gold);font-size:20px}.plus{border:0;border-radius:50%;width:32px;height:32px;background:linear-gradient(135deg,#ffe08e,#d99a2f);font-size:24px;font-weight:800;line-height:1;color:#211307}
.hero{position:relative;overflow:hidden;min-height:405px;border:1px solid #76535e;border-radius:30px;background:linear-gradient(100deg,#24171a 0%,#17121b 58%,#33202e 100%);box-shadow:0 12px 35px #0008}
.hero-copy{position:relative;z-index:2;width:67%;padding:36px 0 30px 28px}
h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(36px,7vw,54px);line-height:1.08;letter-spacing:-1.3px;margin:0 0 20px}
.hero p{font-size:17px;line-height:1.55;color:#ddd9e2;margin:0 0 25px;max-width:310px}
.hero-photo{position:absolute;right:-4px;bottom:0;width:48%;height:100%;object-fit:cover;object-position:45% center;mask-image:linear-gradient(to right,transparent 0%,black 27%)}
.primary{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:330px;border:1px solid #ffe3a0;border-radius:50px;padding:17px 12px;background:linear-gradient(100deg,#ffe08b,#f4a82c);color:#130e0a;font-size:19px;font-weight:800;box-shadow:0 5px 24px #f4ae3b44}
.primary span{font-size:22px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 34px}
.quick button{min-width:0;height:122px;border-radius:28px;background:linear-gradient(145deg,#171421,#0d0d16);border:1px solid #45364d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:600 14px 'DM Sans';}
.quick button:first-child{border:2px solid #f044b8;box-shadow:0 0 17px #f044b866,inset 0 0 16px #f044b822}
.quick button:last-child{border-color:#872cff}
.qicon{font-size:32px;line-height:1;color:#e9a6ff;text-shadow:0 0 12px #b34aff}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 18px}
.section-head h2{font-size:24px;margin:0;font-weight:800}
.online{display:flex;align-items:center;gap:10px}.dot{width:12px;height:12px;border-radius:50%;background:#20df91;box-shadow:0 0 12px #20df91}
.view{background:none;border:0;color:var(--gold);font:700 15px 'DM Sans'}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.person{overflow:hidden;border-radius:24px;border:1px solid #59415a;background:linear-gradient(#171421,#17121e);position:relative}
.person-photo{height:190px;width:100%;object-fit:cover;display:block}
.person-info{padding:10px 10px 13px;background:linear-gradient(180deg,#18131f,#100e18)}
.person-name{font-weight:800;font-size:15px;white-space:nowrap}.verified{color:#22baff;font-size:15px}
.lang{color:var(--muted);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate{color:var(--gold);font-weight:800;font-size:16px;margin-top:8px}
.online-dot{position:absolute;top:12px;left:12px;width:12px;height:12px;border-radius:50%;background:#20df91;box-shadow:0 0 12px #20df91}
.call-bubble{position:absolute;right:10px;top:154px;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f044b8,#812bff);display:grid;place-items:center;font-size:18px;box-shadow:0 0 14px #b33bff99}
.recharge{margin:24px 0 18px;border:1px solid #a23bdb;border-radius:25px;padding:17px 16px;background:radial-gradient(circle at 10% 50%,#52236c,#211333 55%,#171024);display:flex;align-items:center;gap:13px;box-shadow:inset 0 0 25px #9b37ff22}
.recharge-icon{font-size:38px;color:#f0a6ff}.recharge-copy{flex:1;min-width:0}.recharge-copy strong{font-size:17px}.recharge-copy small{display:block;color:#d7cde2;margin-top:5px;font-size:12px}
.add{border:0;border-radius:30px;padding:12px 14px;background:linear-gradient(100deg,#ed39d4,#7825ff);color:#fff;font-size:14px;font-weight:800;white-space:nowrap}
.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);padding:13px 8px 17px;background:#11101af2;border:1px solid #35283d;border-radius:30px 30px 0 0;display:grid;grid-template-columns:repeat(5,1fr);backdrop-filter:blur(16px)}
.bottom button{border:0;background:none;color:#d6d2df;display:flex;flex-direction:column;align-items:center;gap:5px;font:500 12px 'DM Sans'}
.bottom .navicon{font-size:24px}.bottom button.active{color:var(--gold);font-weight:800}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#292035;border:1px solid #8053a0;border-radius:14px;padding:12px 16px;display:none;z-index:20;font-size:13px;max-width:90%;text-align:center}
@media(max-width:380px){.app{padding-left:11px;padding-right:11px}.hero{min-height:370px}.hero-copy{padding:28px 0 24px 20px;width:70%}.hero p{font-size:15px}.quick{gap:8px}.quick button{height:108px;border-radius:22px;font-size:12px}.person-photo{height:155px}.call-bubble{top:120px}.person-info{padding:8px}.person-name{font-size:13px}.rate{font-size:14px}.recharge{gap:8px;padding:14px 10px}.add{font-size:12px;padding:11px 10px}}
</style>
</head>
