<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070d">
<title>Friendship — Connect Beyond Distance</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#08070d;--panel:#17121f;--gold:#ffd16b;--pink:#f044b8;--purple:#9b35ff;--muted:#b9b3c3}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom));}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.app{width:100%;max-width:520px;margin:0 auto;padding:10px 17px 28px}
.top{height:122px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{width:62%;height:112px;object-fit:contain;object-position:left center}
.balance{flex-shrink:0;border:2px solid var(--gold);border-radius:40px;padding:10px 9px;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#2b2118,#100d12);box-shadow:0 0 15px #ffcb5a22;font-weight:800;font-size:16px;white-space:nowrap}
.balance .plus{width:35px;height:35px;border-radius:50%;background:linear-gradient(#ffe49a,#e99b22);color:#211506;font-size:25px;line-height:30px;border:2px solid #fff0b4}
.hero{height:452px;position:relative;overflow:hidden;border:1.5px solid #63444f;border-radius:40px;background:radial-gradient(ellipse at 80% 40%,#4c2635 0,#21151d 45%,#120d13 78%);box-shadow:inset 0 0 30px #e8a15b0c}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(22,14,19,.99) 0%,rgba(22,14,19,.94) 47%,rgba(22,14,19,.08) 100%);pointer-events:none}
.hero img{position:absolute;right:-5px;bottom:0;height:100%;width:54%;object-fit:cover;object-position:48% 20%}
.hero-copy{position:relative;z-index:2;padding:40px 0 0 44px;width:68%}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,7vw,58px);line-height:1.02;letter-spacing:-1.6px;margin:0 0 24px;font-weight:700}
.hero p{font-size:clamp(16px,3.2vw,23px);line-height:1.45;color:#ded8e1;margin:0 0 36px;max-width:440px}
.gold-btn{height:84px;width:min(100%,460px);border-radius:50px;background:linear-gradient(105deg,#ffe28a,#ffad16 75%,#d88a19);color:#130d08;font-size:27px;font-weight:850;box-shadow:0 8px 25px #ffb32e22,inset 0 2px 2px #fff7c7;display:flex;align-items:center;justify-content:center;gap:18px;border:2px solid #ffdf91}
.gold-btn svg{width:42px;height:42px;fill:#100b08}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:38px 5px 48px}
.quick button{height:150px;border:2px solid #38303f;border-radius:34px;background:linear-gradient(145deg,#17121f,#0e0c14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:21px;font-weight:650;box-shadow:inset 0 0 20px #fff1}
.quick button svg{width:55px;height:55px;stroke:#e8a4ff;stroke-width:2.6;fill:none;filter:drop-shadow(0 0 7px #db43ff88)}
.quick .active{border:3px solid #f34acb;box-shadow:0 0 20px #f044b855,inset 0 0 22px #f044b822}
.quick .wallet{border-color:#9636e8;box-shadow:0 0 18px #8c31ff22}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 5px 24px}
.section-head h2{font-size:clamp(25px,5vw,38px);margin:0;font-weight:850;display:flex;align-items:center;gap:16px}
.online-dot{width:23px;height:23px;border-radius:50%;background:#20d88b;box-shadow:0 0 18px #20d88b}
.view{background:none;color:var(--gold);font-size:22px;font-weight:750;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:0 5px 38px}
.person{overflow:hidden;border:1.5px solid #594052;border-radius:34px;background:linear-gradient(150deg,#29202d,#100d15);min-width:0;box-shadow:0 8px 22px #0008}
.photo{height:255px;position:relative;overflow:hidden;background:#211923}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 24%;display:block}
.online{position:absolute;left:18px;top:18px;width:22px;height:22px;border-radius:50%;background:#22d995;box-shadow:0 0 13px #22d995}
.call{position:absolute;right:14px;bottom:12px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ed27d5,#7825ff);display:grid;place-items:center;box-shadow:0 0 18px #d62fff88}
.call svg{width:27px;height:27px;fill:white}
.person-info{padding:12px 17px 18px;background:linear-gradient(180deg,#211824,#100d15)}
.name{font-size:23px;font-weight:850;white-space:nowrap;display:flex;align-items:center;gap:6px}
.verified{width:22px;height:22px;background:#159de9;border-radius:50%;font-size:15px;display:inline-grid;place-items:center;color:white}
.lang{font-size:18px;color:#c4bdcc;margin-top:6px;white-space:nowrap}
.price{font-size:23px;color:var(--gold);font-weight:850;margin-top:9px;white-space:nowrap}
.recharge{margin:0 0 34px;border:2px solid #9b45d5;border-radius:32px;padding:24px 22px;background:radial-gradient(ellipse at 75% 40%,#48206b,#24133d 55%,#17101f);display:flex;align-items:center;gap:20px;box-shadow:0 0 20px #8e36df22}
.wallet-icon{width:88px;height:78px;flex-shrink:0;stroke:#f3baff;fill:none;stroke-width:2;filter:drop-shadow(0 0 8px #d95cff)}
.recharge-copy{min-width:0;flex:1}
.recharge h3{font-size:27px;margin:0 0 7px;font-weight:850}
.recharge p{font-size:17px;color:#ded2e8;margin:0;line-height:1.35}
.add{border-radius:40px;background:linear-gradient(110deg,#ed39df,#7925ff);padding:16px 20px;font-size:21px;font-weight:850;white-space:nowrap;box-shadow:0 0 18px #c52dff55}
.bottom{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);height:112px;padding:12px 8px calc(12px + env(safe-area-inset-bottom));border:1.5px solid #34283d;border-radius:38px 38px 0 0;background:rgba(16,13,23,.97);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -8px 30px #0008}
.nav{background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#e5e0eb;font-size:17px;position:relative}
.nav svg{width:37px;height:37px;stroke:currentColor;fill:none;stroke-width:2}
.nav.selected{color:var(--gold);font-weight:750}
.nav.selected svg{fill:#ffd36a22;filter:drop-shadow(0 0 8px #ffca5b88)}
.badge{position:absolute;top:0;right:22%;background:#e83bbd;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:16px;color:white}
@media(max-width:390px){.app{padding-left:12px;padding-right:12px}.top{height:100px}.hero{height:410px;border-radius:32px}.hero-copy{padding:30px 0 0 26px;width:70%}.hero h1{font-size:39px}.hero p{font-size:16px;margin-bottom:24px}.gold-btn{height:66px;font-size:21px}.quick{gap:10px;margin:28px 0 38px}.quick button{height:125px;border-radius:26px;font-size:16px}.quick button svg{width:43px;height:43px}.cards{gap:10px}.photo{height:205px}.person-info{padding:10px}.name{font-size:18px}.lang{font-size:14px}.price{font-size:18px}.recharge{padding:17px 13px;gap:10px}.wallet-icon{width:60px}.recharge h3{font-size:19px}.recharge p{font-size:13px}.add{font-size:15px;padding:13px 12px}.nav{font-size:14px}.nav svg{width:30px;height:30px}}
</style>
</head>
