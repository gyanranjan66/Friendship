<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070d">
<title>Friendship — Connect Beyond Distance</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08070d;--panel:#15121d;--gold:#ffd16c;--pink:#ff45bd;--purple:#a43aff;--muted:#bcb6c5;--line:#403548}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#24132b 0%,#08070d 48%);color:#fff;font-family:"DM Sans",Arial,sans-serif;padding:0 0 calc(92px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer}
.app{width:100%;max-width:520px;margin:0 auto;padding:10px 16px 24px}
.header{height:82px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:block;width:min(61%,330px);height:72px;object-fit:contain;object-position:left center}
.walletTop{display:flex;align-items:center;gap:8px;border:1.5px solid var(--gold);border-radius:30px;padding:9px 12px;background:#211a19;color:#fff;font-weight:800;white-space:nowrap;box-shadow:0 0 16px #f6b84b22}
.walletTop .coin{color:var(--gold);font-size:20px}.walletTop .plus{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(#ffe08b,#e99b2c);color:#201307;font-size:21px}
.hero{height:286px;position:relative;overflow:hidden;border:1px solid #76505c;border-radius:28px;background:linear-gradient(105deg,#30201f 0%,#171018 57%,#321a2a 100%);box-shadow:0 10px 32px #0008}
.heroCopy{position:relative;z-index:2;width:68%;padding:29px 0 18px 25px}
.hero h1{font:800 clamp(30px,7vw,42px)/1.08 "Playfair Display",Georgia,serif;letter-spacing:-.8px;margin:0 0 17px}
.hero p{font-size:15px;line-height:1.55;color:#e4dce6;margin:0;max-width:270px}
.heroPhoto{position:absolute;right:0;bottom:0;width:48%;height:100%;object-fit:cover;object-position:50% 12%;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 25%);mask-image:linear-gradient(90deg,transparent 0%,#000 25%)}
.cta{margin-top:19px;padding:15px 22px;min-width:220px;border-radius:40px;background:linear-gradient(100deg,#ffe18a,#f2a52c);color:#160f0a;font-size:17px;font-weight:800;box-shadow:0 5px 18px #ffbf4c40}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 2px 28px}
.quick button{min-width:0;min-height:112px;border-radius:25px;background:linear-gradient(145deg,#17131f,#0e0d15);border:1px solid #41374c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:700}
.quick button:first-child{border:2px solid var(--pink);box-shadow:0 0 16px #ff45bd70,inset 0 0 20px #ff45bd20}
.quick button:last-child{border-color:var(--purple);box-shadow:inset 0 0 18px #9b35ff22}
.icon{width:34px;height:34px;display:block;color:#f2a5ff;filter:drop-shadow(0 0 7px #d24dff88)}
.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:0 4px 17px}
.sectionHead h2{font-size:22px;font-weight:800;margin:0}
.dot{display:inline-block;width:12px;height:12px;background:#19d98b;border-radius:50%;margin-right:8px;box-shadow:0 0 12px #19d98b}
.viewAll{color:var(--gold);font-weight:800;font-size:14px;background:none;border:0}
.profiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.person{position:relative;overflow:hidden;border-radius:24px;border:1px solid #514052;background:linear-gradient(#211725,#100e17);min-width:0}
.personPhoto{display:block;width:100%;height:180px;object-fit:cover;object-position:center top}
.online{position:absolute;top:12px;left:12px;width:12px;height:12px;border-radius:50%;background:#20dc91;box-shadow:0 0 12px #20dc91}
.cam{position:absolute;right:10px;top:145px;width:42px;height:42px;border:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f22cce,#8427ff);box-shadow:0 0 16px #bd31ff80;color:white}
.cam svg{width:22px;height:22px}
.personInfo{padding:9px 10px 13px;background:linear-gradient(180deg,#17121d,#100e17)}
.person h3{font-size:15px;white-space:nowrap;margin:0}
.verified{color:#22baff;font-size:14px}
.personInfo p{color:var(--muted);font-size:12px;margin:5px 0 0;white-space:nowrap}
.price{color:var(--gold);font-weight:800;font-size:15px;margin-top:8px}
.recharge{margin-top:24px;border:1px solid #a34cff;border-radius:23px;padding:17px 15px;background:linear-gradient(100deg,#301849,#21132f 60%,#35165c);display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:inset 0 0 25px #a02cff20}
.walletIcon{width:42px;height:42px;color:#efbaff;flex:0 0 auto}
.rechargeText{flex:1;min-width:0}.recharge strong{font-size:17px;display:block}.recharge small{display:block;color:#ddd1e9;font-size:12px;margin-top:5px;line-height:1.35}
.add{border:0;border-radius:28px;padding:12px 15px;background:linear-gradient(100deg,#ed35d3,#792cff);color:#fff;font-weight:800;white-space:nowrap;font-size:14px}
.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);height:calc(82px + env(safe-area-inset-bottom));padding:9px 5px calc(9px + env(safe-area-inset-bottom));background:#12101aee;backdrop-filter:blur(16px);border:1px solid #352b40;border-bottom:0;border-radius:28px 28px 0 0;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -8px 25px #0008}
.bottom button{border:0;background:none;color:#e9e5ef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px}
.bottom svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bottom button.active{color:var(--gold);font-weight:800}
.toast{position:fixed;z-index:20;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;background:#292033;border:1px solid #72517f;color:white;padding:10px 16px;border-radius:20px;font-size:13px;max-width:90%;text-align:center}
@media(max-width:380px){.app{padding-left:11px;padding-right:11px}.quick{gap:7px}.quick button{min-height:100px;font-size:11px}.personPhoto{height:150px}.cam{top:117px;width:36px;height:36px}.heroCopy{padding-left:19px}.hero h1{font-size:29px}.hero p{font-size:13px}.cta{min-width:190px;padding:13px 17px}.recharge{padding:14px 11px}.add{font-size:12px;padding:11px 12px}}
</style>
</head>
