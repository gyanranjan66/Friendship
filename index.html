<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#08070d"><title>Friendship — Connect Beyond Distance</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08070d;--gold:#ffd16c;--pink:#ff45bd;--muted:#b8b3c2}
*{box-sizing:border-box;margin:0;padding:0} body{background:radial-gradient(ellipse at 50% 0%,#211326 0%,var(--bg) 43%);color:#fff;font-family:'DM Sans',Arial,sans-serif;padding-bottom:100px}
button{font:inherit;border:0;cursor:pointer}.app{max-width:520px;margin:auto;padding:12px 16px 22px}
.header{height:78px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{width:62%;max-width:340px;object-fit:contain;object-position:left center}
.wallet-top{white-space:nowrap;border:1.5px solid var(--gold);border-radius:30px;padding:10px 12px;color:#fff;background:#211a19;box-shadow:0 0 16px #f6b84b22;font-weight:800}.wallet-top b{color:var(--gold);font-size:20px;margin-left:8px}
.hero{height:285px;position:relative;overflow:hidden;border:1px solid #76505c;border-radius:28px;background:linear-gradient(100deg,#2a1d1d 0%,#171018 58%,#321a2a 100%);box-shadow:0 10px 32px #0008}
.hero-copy{position:relative;z-index:2;width:67%;padding:30px 0 20px 26px}.hero h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(30px,7vw,42px);line-height:1.08;letter-spacing:-1px;margin-bottom:18px}
.hero p{font-size:15px;line-height:1.55;color:#e4dce6;max-width:270px}.hero-person{position:absolute;right:0;bottom:0;height:100%;width:47%;object-fit:cover;object-position:50% 15%;mask-image:linear-gradient(to right,transparent 0%,#000 25%)}
.cta{margin-top:20px;background:linear-gradient(100deg,#ffe18a,#f2a52c);color:#160f0a;font-weight:800;font-size:17px;border-radius:40px;padding:15px 24px;min-width:220px;box-shadow:0 5px 18px #ffbf4c40}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 2px 28px}.quick button{min-width:0;min-height:112px;border-radius:25px;background:linear-gradient(145deg,#17131f,#0e0d15);border:1px solid #41374c;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:700}
.quick button:first-child{border:2px solid var(--pink);box-shadow:0 0 16px #ff45bd70,inset 0 0 20px #ff45bd20}.quick button:last-child{border-color:#a43aff;box-shadow:inset 0 0 18px #9b35ff22}
.qicon{font-size:31px;line-height:1;color:#f3a6ff;text-shadow:0 0 12px #d24dff}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 17px}.section-head h2{font-size:22px;font-weight:800}.online-dot{display:inline-block;width:12px;height:12px;background:#19d98b;border-radius:50%;margin-right:8px;box-shadow:0 0 12px #19d98b}
.viewall{color:var(--gold);font-weight:800;font-size:14px;background:none}.profiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.person{position:relative;overflow:hidden;border-radius:24px;border:1px solid #514052;background:linear-gradient(#211725,#100e17);min-width:0}.person img{display:block;width:100%;height:180px;object-fit:cover;object-position:center top}
.online{position:absolute;top:12px;left:12px;width:12px;height:12px;border-radius:50%;background:#20dc91;box-shadow:0 0 12px #20dc91}.cam{position:absolute;right:10px;top:145px;background:linear-gradient(135deg,#f22cce,#8427ff);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;box-shadow:0 0 16px #bd31ff80}
.person-info{padding:9px 10px 13px;background:linear-gradient(180deg,#17121d,#100e17)}.person h3{font-size:15px;white-space:nowrap}.verified{color:#22baff;font-size:14px}.person p{color:var(--muted);font-size:12px;margin-top:5px;white-space:nowrap}.price{color:var(--gold);font-weight:800;font-size:15px;margin-top:8px}
.recharge{margin-top:24px;border:1px solid #a34cff;border-radius:23px;padding:17px 15px;background:linear-gradient(100deg,#301849,#21132f 60%,#35165c);display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:inset 0 0 25px #a02cff20}
.recharge strong{font-size:17px;display:block}.recharge small{display:block;color:#ddd1e9;font-size:12px;margin-top:5px}.wallet-icon{font-size:34px;color:#efbaff}.add{border-radius:28px;padding:12px 15px;background:linear-gradient(100deg,#ed35d3,#792cff);color:#fff;font-weight:800;white-space:nowrap;font-size:14px}
.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);height:82px;background:#12101aee;backdrop-filter:blur(16px);border:1px solid #352b40;border-bottom:0;border-radius:28px 28px 0 0;display:grid;grid-template-columns:repeat(5,1fr);padding:9px 5px max(9px,env(safe-area-inset-bottom));box-shadow:0 -8px 25px #0008}
.bottom button{background:none;color:#e9e5ef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px}.bottom .navicon{font-size:23px;line-height:1}.bottom button.active{color:var(--gold);font-weight:800}
.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#292033;border:1px solid #72517f;color:white;padding:10px 16px;border-radius:20px;display:none;z-index:20;font-size:13px;max-width:90%;text-align:center}
@media(max-width:370px){.app{padding-left:11px;padding-right:11px}.quick{gap:7px}.quick button{min-height:100px;font-size:11px}.person img{height:150px}.cam{top:117px;width:36px;height:36px}.hero-copy{padding-left:19px}.hero h1{font-size:29px}.hero p{font-size:13px}.cta{min-width:190px;padding:13px 17px}.recharge{padding:14px 11px}.add{font-size:12px;padding:11px 12px}}
</style></head><body><main class="app">
