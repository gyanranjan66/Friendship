*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#321437 0,#100a16 36%,var(--bg) 70%);color:#fff;font-family:"DM Sans",Arial,sans-serif;min-height:100vh;padding-bottom:104px}button,input,textarea,select{font:inherit}button{color:inherit;border:0;cursor:pointer}.app{width:min(100%,560px);margin:auto;padding:14px 14px 30px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:8px;min-width:0}.brand img{width:59px;height:59px;filter:drop-shadow(0 0 10px #f044b877)}.brand-word{font:800 italic clamp(25px,6vw,35px) "Playfair Display",Georgia,serif;letter-spacing:-1px;color:#ffd56e;text-shadow:0 2px 18px #f7bc4c55;white-space:nowrap}.brand-line{height:3px;width:75%;margin:0 auto;background:linear-gradient(90deg,transparent,#f22cae,transparent);transform:rotate(-5deg)}.wallet-pill{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1.5px solid var(--gold);border-radius:30px;background:#15101a;box-shadow:0 0 12px #ffcb4b18;white-space:nowrap;font-weight:800}.wallet-pill svg{width:25px;height:25px;stroke:var(--gold);fill:none;stroke-width:1.8}.wallet-plus{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#ffe98e,#ffb600);color:#261507;font-size:24px;line-height:1}.screen{display:none;animation:appear .2s ease}.screen.active{display:block}@keyframes appear{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:none}}
