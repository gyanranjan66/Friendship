<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friendship — Connect Beyond Distance</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--panel:#141720;--gold:#d8b779;--muted:#9298a6;--white:#f7f5f0;--line:#252a35}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif}
.app{max-width:480px;margin:auto;padding:16px 20px 100px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.wallet{border:1px solid #51432d;background:#211d16;padding:10px 14px;border-radius:30px;color:var(--gold);font-weight:700}
h1{font-family:'Playfair Display',serif;font-size:36px}
.sub{color:var(--muted);font-size:14px;margin-top:12px}
.hero{padding:27px 23px;border:1px solid #39332a;border-radius:23px;background:linear-gradient(135deg,#252017,#15171d 70%)}
.primary{margin-top:22px;background:var(--gold);color:#17130d;border:0;border-radius:13px;padding:14px;width:100%;font-weight:800;cursor:pointer}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:16px}
.person{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:12px}
.avatar{height:125px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:40px;color:#f5dfb9;background:linear-gradient(145deg,#70523d,#292f3b)}
.person h3{font-size:14px;margin-top:12px}
.person p{font-size:11px;color:var(--muted);margin-top:5px}
.rate{font-size:12px;color:var(--gold);margin-top:10px;font-weight:700}
.status{display:inline-block;width:7px;height:7px;border-radius:50%;background:#62c99b;margin-right:5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;margin-top:14px}
.panel p{font-size:13px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#11141c;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:13px 8px 20px}
.nav button{background:none;border:0;color:var(--muted);font-size:11px;cursor:pointer}
.nav .active{color:var(--gold)}
.balance{font-family:'Playfair Display',serif;font-size:32px;color:var(--gold);margin:10px 0}
.action{background:#222733;border:1px solid var(--line);border-radius:12px;color:#fff;padding:13px;width:100%;margin-top:12px;font-weight:700}
@media(max-width:360px){.app{padding:16px 15px 100px}h1{font-size:32px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img src="logo.png" alt="logo" style="width:70%;max-height:78px;object-fit:contain">
    <div class="wallet">₹0</div>
  </header>

  <section class="hero">
    <h1>Connect Beyond Distance</h1>
    <p class="sub">Find and book trusted friends for chats, calls and companionship — anytime, anywhere.</p>
    <button class="primary" onclick="alert('Welcome to Friendship!')">Get Started</button>
  </section>

  <h2 style="margin:30px 0 16px">Online Now</h2>
  <div class="cards">
    <div class="person">
      <div class="avatar">A</div>
      <h3><span class="status"></span>Aarohi</h3>
      <p>Hindi • English</p>
      <div class="rate">₹49/min</div>
    </div>
    <div class="person">
      <div class="avatar" style="background:linear-gradient(145deg,#6d465e,#272b40)">R</div>
      <h3><span class="status"></span>Riya</h3>
      <p>Hindi • Bengali</p>
      <div class="rate">₹39/min</div>
    </div>
  </div>

  <div class="panel">
    <h2>Wallet</h2>
    <div class="balance">₹0.00</div>
    <p>Add money to start connecting instantly.</p>
    <button class="action">Add Money</button>
  </div>
</div>

<nav class="nav">
  <button class="active">🏠<br>Home</button>
  <button>💬<br>Chats</button>
  <button>👤<br>Profile</button>
</nav>
</body>
<script>
(async function () {
  const tg = window.Telegram?.WebApp;

  if (!tg) {
    console.log("Please open Friendship from Telegram");
    return;
  }

  tg.ready();
  tg.expand();

  try {
    const response = await fetch(
      "https://friendship-backend.gyanranjan500.workers.dev",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          initData: tg.initData,
          room: "friendship-main"
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "Login failed");
    }

    window.friendshipSession = data;

    const userName = document.getElementById("userName");
    if (userName) {
      userName.textContent = data.name || "Welcome";
    }

    console.log("Friendship Telegram login successful");

  } catch (error) {
    console.error("Friendship login error:", error);
  }
})();
</script>
</html>
